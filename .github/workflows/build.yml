name: Compila NDS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compila
        run: make
      - name: Salva il file .nds
        uses: actions/upload-artifact@v4
        with:
          name: dsi-video-player
          path: "*.nds"
        
